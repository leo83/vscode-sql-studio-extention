[project]
name = "sql-studio"
version = "0.1.0"
description = "SQL Studio backend — query execution, schema introspection, export"
readme = "README.md"
authors = [{ name = "lev", email = "lev.ragulin@gmail.com" }]
license = { text = "The Beerware License (Revision 42)" }
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.1.0",
    "clickhouse-driver>=0.2.10",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "sqlglot>=30.8.0",
]

[project.scripts]
sql-studio-server = "sql_studio.server:main"
sql-studio-mcp = "sql_studio.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
