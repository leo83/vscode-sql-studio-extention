---
name: Feature request
description: Suggest an idea for SQL Studio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved and how SQL Studio could help.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or missing capability does this address?
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like SQL Studio to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Database Explorer
        - Query execution / results
        - Connection dialog
        - SQL editor / formatting
        - New database dialect
        - Cursor Agent / MCP
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you've tried

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, example SQL, etc.
