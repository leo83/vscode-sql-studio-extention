---
name: Bug report
description: Report a bug in SQL Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - VS Code
        - Cursor
    validations:
      required: true

  - type: input
    id: editor-version
    attributes:
      label: Editor version
      placeholder: e.g. VS Code 1.95.0 / Cursor 0.45
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database type
      options:
        - PostgreSQL
        - ClickHouse
        - Microsoft SQL Server
        - MySQL
        - SQLite
        - Other / N/A
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add connection ...
        2. Run query ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message / logs
      description: Copy from SQL Results panel, notification, or Output → SQL Studio
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, uv version (`uv --version`), ODBC setup for MSSQL, etc.
